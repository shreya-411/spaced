name: Sync from fork

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  merge-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add fork as remote and merge
        run: |
          git remote add fork https://github.com/shreya-411/spaced.git
          git fetch fork
          git checkout main
          git merge fork/main --no-edit
          git push origin main
